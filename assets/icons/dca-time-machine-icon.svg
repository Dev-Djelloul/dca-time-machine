<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rewind arc: ~260° open circle, drawn clockwise, gap = "cursor" arrowhead -->
  <path d="M 48.85 46.15 A 22 22 0 1 1 43 13"
        fill="none" stroke="#39FF9C" stroke-width="6" stroke-linecap="square"/>

  <!-- Terminal cursor block = arrowhead / rewind direction marker -->
  <rect x="38.5" y="8.5" width="9" height="9" fill="#39FF9C"/>

  <!-- Candlestick frozen at the center = "price, held in time" -->
  <line x1="32" y1="20" x2="32" y2="44" stroke="#39FF9C" stroke-width="3"/>
  <rect x="27" y="25" width="10" height="14" fill="#39FF9C"/>
</svg>
